<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Régie QPUC</title>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --blue-qpuc: #0091d2;
            --green-tirage: #27ae60;
            --red-exit: #d0002d;
            --yellow-4als: #f1c40f;
            --orange-faf: #e67e22;
            --red-win: #c0392b;
        }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--bg-dark); color: white;
            font-family: 'Arial', sans-serif; overflow: hidden;
        }
        .main-container {
            width: 100%; max-width: 420px; height: 100vh; margin: 0 auto;
            display: flex; flex-direction: column; align-items: center;
            padding: 15px; box-sizing: border-box;
        }
        
        /* Header */
        .header-btns { width: 100%; display: flex; justify-content: space-between; margin-bottom: 20px; }
        .btn-top {
            background: none; border: 2px solid white; color: white;
            border-radius: 20px; padding: 8px 15px; font-size: 0.8rem; cursor: pointer; text-transform: uppercase;
        }
        .btn-top.active { background: var(--red-win); border-color: var(--red-win); }
        
        /* Zone de jeu */
        #current-players { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 15px; width: 100%; }
        .player-row { display: flex; gap: 10px; justify-content: center; width: 100%; }
        .player-badge {
            background: white; color: black; border-radius: 30px; padding: 12px;
            font-size: 1.1rem; width: 125px; text-align: center; font-weight: normal;
            cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.5); text-transform: uppercase;
        }

        /* Nav Footer */
        .footer-nav { width: 100%; display: flex; gap: 10px; margin-top: auto; padding-bottom: 10px; }
        .btn-nav {
            flex: 1; background: none; border: 2px solid white; color: white;
            border-radius: 30px; padding: 12px 0; font-size: 0.9rem; cursor: pointer; text-transform: uppercase;
        }

        /* Overlays & Modals */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; z-index: 1000;
        }
        .modal {
            background: white; border-radius: 25px; width: 92%; max-width: 380px;
            margin: 20px auto; color: black; position: relative; padding: 15px;
            max-height: 90vh; display: flex; flex-direction: column;
        }
        .close-circle {
            position: absolute; top: -12px; right: -12px; background: var(--red-exit);
            color: white; width: 35px; height: 35px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            border: 2px solid white; font-size: 20px; font-weight: bold;
        }

        /* Onglet Groupes UI Originale */
        .btn-tirage {
            background: var(--green-tirage); color: white; border-radius: 15px;
            padding: 10px 40px; font-size: 1.6rem; border: none; cursor: pointer;
            align-self: center; margin-bottom: 10px; font-weight: bold;
        }
        .groupes-table { width: 100%; border-collapse: collapse; }
        .groupes-table th { font-size: 0.7rem; color: #777; text-align: center; text-transform: uppercase; }
        .groupes-table td { padding: 8px 4px; text-align: center; font-size: 1.1rem; }
        .name-td { text-align: left !important; width: 50%; font-weight: normal; }
        .status-red { color: var(--red-win); }
        .status-blue { color: var(--blue-qpuc); font-weight: bold; }
        input[type="checkbox"] { transform: scale(1.6); }

        /* Onglet Participants UI Originale */
        .pill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow-y: auto; }
        .p-pill { 
            border: 1.5px solid #ddd; border-radius: 20px; padding: 8px;
            text-align: center; font-size: 0.85rem; cursor: pointer; color: #999; font-weight: normal;
        }
        .p-pill.active { border-color: var(--blue-qpuc); color: black; background: #f8f9fa; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-btns">
        <button class="btn-top" onclick="confirmReset()">Nouvelle séance</button>
        <button id="m-toggle" class="btn-top" onclick="toggleModeM()">Changer joueur</button>
    </div>

    <div id="current-players"></div>

    <div class="footer-nav">
        <button class="btn-nav" onclick="openM('modal-p')">Participants</button>
        <button class="btn-nav" onclick="openM('modal-g')">Groupes</button>
    </div>
</div>

<div id="modal-g" class="overlay">
    <div class="modal">
        <div class="close-circle" onclick="closeM('modal-g')">✕</div>
        <button class="btn-tirage" onclick="lancerTirage()">TIRAGE</button>
        <div style="overflow-y: auto;">
            <table class="groupes-table">
                <thead>
                    <tr><th style="width:15%"></th><th class="name-td">NOM</th><th>SCORE</th><th>PJ</th></tr>
                </thead>
                <tbody id="body-g"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modal-p" class="overlay">
    <div class="modal">
        <div class="close-circle" onclick="closeM('modal-p')">✕</div>
        <div class="pill-grid" id="grid-p"></div>
    </div>
</div>

<div id="modal-replacement" class="overlay">
    <div class="modal">
        <div class="close-circle" onclick="closeM('modal-replacement')">✕</div>
        <div class="pill-grid" id="grid-replacement"></div>
    </div>
</div>

<script>
    const WEB_APP_URL = `https://script.google.com/macros/s/AKfycbw7rQ1oTrRFAVH5XAbfLT-2KiCp-rAoPRV4JG2am-59AyRrag2OvcGXNQNbSXEFDgJN/exec`;
    let players = ["ANTOINE", "CYRILLE", "DAMIEN", "DANIÈLE", "ELIOTT", "ERIC", "GEOFFREY", "HENRICK", "LOUIS", "LYSIANE", "MADELEINE", "MICHÈLE", "PATRICE", "PATRICIA C", "PATRICIA L", "PHILIPPE L", "PHILIPPE M", "PHILIPPE O", "RENÉ", "ROLANDE", "SÉBASTIEN", "VALERIE", "YANN", "WILLIAM"].map(n => ({ name: n, active: true, score: 0, pj: 0 }));
    let poolEnJeu = [];
    let playerStates = {};
    let modeM = false;
    let replacementTarget = null;

    const renderDisplay = () => {
        const div = document.getElementById('current-players'); div.innerHTML = '';
        if(poolEnJeu.length === 0) return;
        [poolEnJeu.slice(0, 3), poolEnJeu.slice(3, 5)].forEach(row => {
            const rDiv = document.createElement('div'); rDiv.className = 'player-row';
            row.forEach(n => {
                const b = document.createElement('div'); b.className = 'player-badge';
                const s = playerStates[n] || 1;
                if(s === 2) { b.style.background = 'var(--yellow-4als)'; b.style.color = 'black'; }
                else if(s === 3) { b.style.background = 'var(--orange-faf)'; b.style.color = 'white'; }
                else if(s === 4) { b.style.background = 'var(--red-win)'; b.style.color = 'white'; }
                b.innerText = n;
                b.onclick = () => {
                    if(modeM) { replacementTarget = n; openReplacementModal(); }
                    else { playerStates[n] = (playerStates[n] >= 4) ? 1 : (playerStates[n] || 1) + 1; renderDisplay(); }
                };
                rDiv.appendChild(b);
            });
            div.appendChild(rDiv);
        });
    };

    const sendResultsToSheet = async () => {
        const data = poolEnJeu.map(n => ({ name: n, status: playerStates[n] || 1 }));
        try { await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) }); } catch(e) {}
    };

    async function lancerTirage() {
        if (poolEnJeu.length > 0) {
            await sendResultsToSheet();
            poolEnJeu.forEach(n => {
                let p = players.find(x => x.name === n);
                let s = playerStates[n] || 1;
                if(s === 2) p.score += 1; else if(s === 3) p.score += 2; else if(s === 4) p.score += 3;
            });
        }

        const checkedNames = Array.from(document.querySelectorAll('.g-chk:checked'))
                                  .map(cb => cb.value)
                                  .filter(n => !poolEnJeu.includes(n));
        
        let selection = [...checkedNames];
        let sortedFullList = [...players].filter(p => p.active).sort((a,b) => a.score - b.score || a.pj - b.pj);
        
        if (selection.length < 5) {
            let eligibles = sortedFullList.filter(p => !poolEnJeu.includes(p.name) && !selection.includes(p.name));
            
            if (selection.length > 0) {
                let indexInSorted = sortedFullList.findIndex(p => p.name === selection[0]);
                let median = sortedFullList.length / 2;

                if (indexInSorted < median) {
                    // Cascade vers le BAS (scores croissants)
                    let candidates = eligibles.sort((a,b) => a.score - b.score || a.pj - b.pj || (Math.random() - 0.5));
                    while (selection.length < 5 && candidates.length > 0) selection.push(candidates.shift().name);
                } else {
                    // Cascade vers le HAUT (scores décroissants)
                    let candidates = eligibles.sort((a,b) => b.score - a.score || b.pj - a.pj || (Math.random() - 0.5));
                    while (selection.length < 5 && candidates.length > 0) selection.push(candidates.shift().name);
                }
            } else {
                eligibles.sort((a,b) => a.pj - b.pj || (Math.random() - 0.5));
                while (selection.length < 5 && eligibles.length > 0) selection.push(eligibles.shift().name);
            }
        }

        poolEnJeu = selection.slice(0, 5).sort(() => Math.random() - 0.5);
        playerStates = {};
        poolEnJeu.forEach(n => { players.find(p => p.name === n).pj++; playerStates[n] = 1; });
        closeM('modal-g');
        renderDisplay();
    }

    const renderG = () => {
        const body = document.getElementById('body-g'); body.innerHTML = '';
        let activePlayers = players.filter(p => p.active).sort((a,b) => a.score - b.score || a.pj - b.pj);
        let minPJ = Math.min(...activePlayers.filter(p => !poolEnJeu.includes(p.name)).map(p => p.pj));

        activePlayers.forEach(p => {
            let isPrevious = poolEnJeu.includes(p.name);
            let tr = document.createElement('tr');
            if (isPrevious) tr.className = 'status-red';
            else if (p.pj === minPJ) tr.className = 'status-blue';

            tr.innerHTML = `
                <td><input type="checkbox" class="g-chk" value="${p.name}" ${p.pj === 0 && !isPrevious ? 'checked' : ''} ${isPrevious ? 'disabled' : ''}></td>
                <td class="name-td">${p.name}</td>
                <td>${p.score}</td>
                <td>${p.pj}</td>
            `;
            body.appendChild(tr);
        });
    };

    const renderP = () => {
        const grid = document.getElementById('grid-p'); grid.innerHTML = '';
        players.sort((a,b) => a.name.localeCompare(b.name)).forEach(p => {
            const d = document.createElement('div'); d.className = `p-pill ${p.active?'active':''}`;
            d.innerText = p.name;
            d.onclick = () => { p.active = !p.active; renderP(); };
            grid.appendChild(d);
        });
    };

    function openReplacementModal() {
        const grid = document.getElementById('grid-replacement'); grid.innerHTML = '';
        players.filter(p => p.active && !poolEnJeu.includes(p.name)).sort((a,b) => a.name.localeCompare(b.name)).forEach(p => {
            const d = document.createElement('div'); d.className = 'p-pill active'; d.innerText = p.name;
            d.onclick = () => {
                players.find(x => x.name === replacementTarget).pj--;
                p.pj++;
                poolEnJeu = poolEnJeu.map(n => n === replacementTarget ? p.name : n);
                playerStates[p.name] = 1;
                toggleModeM(); closeM('modal-replacement'); renderDisplay();
            };
            grid.appendChild(d);
        });
        document.getElementById('modal-replacement').style.display = 'block';
    }

    const openM = (id) => { if(id==='modal-g') renderG(); if(id==='modal-p') renderP(); document.getElementById(id).style.display='block'; };
    const closeM = (id) => { document.getElementById(id).style.display='none'; };
    const toggleModeM = () => { modeM = !modeM; document.getElementById('m-toggle').classList.toggle('active', modeM); };
    const confirmReset = () => { if(confirm("Nouvelle séance ?")) location.reload(); };
</script>
</body>
</html>
