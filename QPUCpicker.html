<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Régie QPUC - Stratégique</title>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --blue-main: #0091d2;
            --green-tirage: #27ae60;
            --red-exit: #d0002d;
            --yellow-4als: #f1c40f;
            --orange-faf: #e67e22;
            --red-win: #c0392b;
        }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--bg-dark); color: white;
            font-family: 'Arial Black', sans-serif; overflow: hidden;
        }
        .main-container {
            width: 100%; max-width: 420px; height: 100vh; margin: 0 auto;
            display: flex; flex-direction: column; align-items: center;
            padding: 15px; box-sizing: border-box;
        }
        
        /* En-tête */
        .header-btns { width: 100%; display: flex; justify-content: space-between; margin-bottom: 20px; }
        .btn-top {
            background: none; border: 2px solid white; color: white;
            border-radius: 20px; padding: 8px 15px; font-size: 0.8rem; cursor: pointer; text-transform: uppercase;
        }
        .btn-top.active { background: var(--red-win); border-color: var(--red-win); }
        
        /* Zone de jeu */
        #display-zone { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 15px; width: 100%; }
        .badge {
            background: white; color: black; border-radius: 30px; padding: 15px;
            font-size: 1.3rem; width: 80%; margin: 0 auto; text-align: center;
            cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.5); text-transform: uppercase;
        }

        .footer-nav { width: 100%; display: flex; gap: 10px; margin-top: auto; padding-bottom: 10px; }
        .btn-nav {
            flex: 1; background: none; border: 2px solid white; color: white;
            border-radius: 30px; padding: 12px 0; font-size: 0.9rem; cursor: pointer; text-transform: uppercase;
        }

        /* Modales */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; z-index: 1000;
        }
        .modal {
            background: white; border-radius: 25px; width: 92%; max-width: 380px;
            margin: 20px auto; color: black; position: relative; padding: 15px;
            max-height: 90vh; display: flex; flex-direction: column;
        }
        .close-circle {
            position: absolute; top: -12px; right: -12px; background: var(--red-exit);
            color: white; width: 35px; height: 35px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            border: 2px solid white; font-size: 20px; z-index: 10;
        }

        /* UI Participants */
        .part-header { background: var(--blue-main); color: white; padding: 10px; border-radius: 20px; text-align: center; margin-bottom: 10px; text-transform: uppercase; }
        .search-bar { display: flex; gap: 5px; margin-bottom: 10px; }
        .search-bar input { flex: 1; border-radius: 15px; border: 1px solid #ccc; padding: 8px; text-transform: uppercase; }
        .btn-add { background: var(--blue-main); color: white; border: none; border-radius: 50%; width: 35px; height: 35px; font-size: 20px; cursor: pointer; }
        .pill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow-y: auto; }
        .p-pill { 
            border: 1.5px solid #ddd; border-radius: 20px; padding: 8px;
            text-align: center; font-size: 0.85rem; cursor: pointer; color: #999;
        }
        .p-pill.active { border-color: var(--blue-main); color: black; background: #f8f9fa; }

        /* UI Groupes */
        .btn-tirage {
            background: var(--green-tirage); color: white; border-radius: 15px;
            padding: 10px 40px; font-size: 1.6rem; border: none; cursor: pointer;
            align-self: center; margin-bottom: 10px; font-weight: 900;
        }
        .groupes-table { width: 100%; border-collapse: collapse; }
        .groupes-table th { font-size: 0.7rem; color: #777; text-align: center; padding: 5px; }
        .groupes-table td { padding: 8px 4px; text-align: center; font-size: 1.2rem; font-weight: 900; }
        .name-td { text-align: left !important; width: 50%; }
        .status-red { color: var(--red-win); }
        .status-blue { color: var(--blue-main); }
        .status-black { color: black; }
        input[type="checkbox"] { transform: scale(1.6); }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-btns">
        <button class="btn-top" onclick="resetSession()">Nouvelle séance</button>
        <button id="btn-m" class="btn-top" onclick="toggleModeM()">Changer joueur</button>
    </div>

    <div id="display-zone">
        <div style="text-align:center; opacity:0.5">Ouvrez "GROUPES" pour commencer</div>
    </div>

    <div class="footer-nav">
        <button class="btn-nav" onclick="openM('modal-p')">Participants</button>
        <button class="btn-nav" onclick="openM('modal-g')">Groupes</button>
    </div>
</div>

<div id="modal-p" class="overlay">
    <div class="modal">
        <div class="close-circle" onclick="closeM('modal-p')">✕</div>
        <div class="part-header">PARTICIPANTS</div>
        <div class="search-bar">
            <input type="text" id="in-add" placeholder="NOM...">
            <button class="btn-add" onclick="addPlayer()">+</button>
        </div>
        <div class="pill-grid" id="grid-p"></div>
    </div>
</div>

<div id="modal-g" class="overlay">
    <div class="modal">
        <div class="close-circle" onclick="closeM('modal-g')">✕</div>
        <button class="btn-tirage" onclick="executerTirage()">TIRAGE</button>
        <div style="overflow-y: auto;">
            <table class="groupes-table">
                <thead>
                    <tr>
                        <th style="width:15%"></th>
                        <th class="name-td"></th>
                        <th>SCORE</th>
                        <th>PARTIES</th>
                    </tr>
                </thead>
                <tbody id="body-g"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modal-swap" class="overlay">
    <div class="modal">
        <div class="close-circle" onclick="closeM('modal-swap')">✕</div>
        <div class="part-header">REMPLACER PAR...</div>
        <div class="pill-grid" id="grid-swap"></div>
    </div>
</div>

<script>
    const WEB_APP_URL = `TON_URL_GOOGLE_SCRIPT_ICI`; // Remplacer par ton URL de déploiement Apps Script

    let players = ["ANTOINE", "CYRILLE", "DAMIEN", "DANIÈLE", "ELIOTT", "ERIC", "GEOFFREY", "HENRICK", "LOUIS", "LYSIANE", "MADELEINE", "MICHÈLE", "PATRICE", "PATRICIA C", "PATRICIA L", "PHILIPPE L", "PHILIPPE M", "PHILIPPE O", "RENÉ", "ROLANDE", "SÉBASTIEN", "VALERIE", "YANN", "WILLIAM"]
        .map(n => ({ name: n, active: true, score: 0, pj: 0 }));
    
    let currentPartie = [];
    let playerStates = {};
    let modeM = false;
    let targetToSwap = null;

    function openM(id) {
        if(id === 'modal-p') renderP();
        if(id === 'modal-g') renderG();
        document.getElementById(id).style.display = 'block';
    }
    function closeM(id) { document.getElementById(id).style.display = 'none'; }

    // --- LOGIQUE PARTICIPANTS ---
    function renderP() {
        const grid = document.getElementById('grid-p'); grid.innerHTML = '';
        players.sort((a,b) => a.name.localeCompare(b.name)).forEach(p => {
            const div = document.createElement('div');
            div.className = `p-pill ${p.active ? 'active' : ''}`;
            div.innerText = p.name;
            div.onclick = () => { p.active = !p.active; renderP(); };
            grid.appendChild(div);
        });
    }

    function addPlayer() {
        const val = document.getElementById('in-add').value.toUpperCase().trim();
        if(val && !players.find(p => p.name === val)) {
            players.push({ name: val, active: true, score: 0, pj: 0 });
            document.getElementById('in-add').value = ''; renderP();
        }
    }

    // --- LOGIQUE GROUPES ---
    function renderG() {
        const body = document.getElementById('body-g'); body.innerHTML = '';
        const eligibles = players.filter(p => p.active && !currentPartie.includes(p.name));
        
        // Calcul du bleu : PJ < 2ème PJ le plus bas parmi les éligibles
        const pjs = [...new Set(eligibles.map(p => p.pj))].sort((a,b) => a - b);
        const thresholdBlue = pjs.length > 1 ? pjs[1] : (pjs[0] || 0);

        let list = players.filter(p => p.active).sort((a,b) => {
            if(b.score !== a.score) return b.score - a.score;
            return a.pj - b.pj;
        });

        list.forEach(p => {
            let colorClass = 'status-black';
            let isCurrent = currentPartie.includes(p.name);
            if(isCurrent) colorClass = 'status-red';
            else if(p.pj < thresholdBlue) colorClass = 'status-blue';

            const tr = document.createElement('tr');
            tr.className = colorClass;
            tr.innerHTML = `
                <td><input type="checkbox" class="g-chk" value="${p.name}"></td>
                <td class="name-td">${p.name}</td>
                <td>${p.score}</td>
                <td>${p.pj}</td>
            `;
            body.appendChild(tr);
        });
    }

    async function executerTirage() {
        // 1. Envoi des résultats de la partie qui vient de se finir
        if(currentPartie.length > 0) {
            await envoyerResultatsSheet();
            // Mise à jour des scores en local
            currentPartie.forEach(n => {
                let p = players.find(x => x.name === n);
                let s = playerStates[n] || 1;
                if(s === 2) p.score += 1;
                else if(s === 3) p.score += 2;
                else if(s === 4) p.score += 3;
            });
        }

        // 2. Nouveau Tirage
        const checked = Array.from(document.querySelectorAll('.g-chk:checked')).map(i => i.value);
        if(checked.length === 0) return alert("Sélectionnez au moins un pool !");

        let selection = [];
        if(checked.length >= 5) {
            selection = checked.sort(() => Math.random() - 0.5).slice(0, 5);
        } else {
            selection = [...checked];
            let eligibles = players.filter(p => p.active && !currentPartie.includes(p.name) && !selection.includes(p.name))
                                   .sort((a,b) => a.pj - b.pj);
            while(selection.length < 5 && eligibles.length > 0) selection.push(eligibles.shift().name);
        }

        currentPartie = selection;
        playerStates = {};
        currentPartie.forEach(n => {
            players.find(x => x.name === n).pj++;
            playerStates[n] = 1;
        });

        closeM('modal-g'); renderMain();
    }

    async function envoyerResultatsSheet() {
        // Prépare les données pour TOUS les joueurs actifs
        // 0: absent, 1: blanc, 2: jaune, 3: orange, 4: rouge
        const data = players.filter(p => p.active).map(p => {
            let s = 0;
            if(currentPartie.includes(p.name)) {
                s = playerStates[p.name] || 1;
            }
            return { name: p.name, score: s };
        });

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            });
        } catch(e) { console.error("Erreur sync Sheet", e); }
    }

    // --- LOGIQUE PRINCIPALE ---
    function renderMain() {
        const zone = document.getElementById('display-zone'); zone.innerHTML = '';
        currentPartie.forEach(name => {
            const b = document.createElement('div');
            b.className = 'badge'; b.innerText = name;
            updateBadgeStyle(b, name);
            b.onclick = () => {
                if(modeM) { targetToSwap = name; openSwap(); }
                else {
                    playerStates[name] = (playerStates[name] % 4) + 1;
                    updateBadgeStyle(b, name);
                }
            };
            zone.appendChild(b);
        });
    }

    function updateBadgeStyle(el, name) {
        const s = playerStates[name];
        el.style.background = 'white'; el.style.color = 'black';
        if(s === 2) el.style.background = 'var(--yellow-4als)';
        if(s === 3) { el.style.background = 'var(--orange-faf)'; el.style.color = 'white'; }
        if(s === 4) { el.style.background = 'var(--red-win)'; el.style.color = 'white'; }
    }

    function toggleModeM() {
        modeM = !modeM;
        document.getElementById('btn-m').classList.toggle('active', modeM);
    }

    function openSwap() {
        const grid = document.getElementById('grid-swap'); grid.innerHTML = '';
        players.filter(p => p.active && !currentPartie.includes(p.name))
               .sort((a,b) => a.name.localeCompare(b.name)).forEach(p => {
            const div = document.createElement('div');
            div.className = 'p-pill active'; div.innerText = p.name;
            div.onclick = () => {
                let oldP = players.find(x => x.name === targetToSwap);
                oldP.pj--; p.pj++;
                currentPartie = currentPartie.map(n => n === targetToSwap ? p.name : n);
                playerStates[p.name] = 1; delete playerStates[targetToSwap];
                closeM('modal-swap'); toggleModeM(); renderMain();
            };
            grid.appendChild(div);
        });
        openM('modal-swap');
    }

    function resetSession() {
        if(confirm("Réinitialiser les scores et parties de la séance ?")) {
            players.forEach(p => { p.score = 0; p.pj = 0; });
            currentPartie = []; renderMain();
        }
    }
</script>
</body>
</html>
