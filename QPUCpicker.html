<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Régie QPUC</title>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --blue-qpuc: #0091d2;
            --green-tirage: #27ae60;
            --red-exit: #d0002d;
            --yellow-4als: #f1c40f;
            --orange-faf: #e67e22;
            --red-win: #c0392b;
        }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--bg-dark); color: white;
            font-family: 'Arial', sans-serif; overflow: hidden;
        }
        .main-container {
            width: 100%; max-width: 420px; height: 100vh; margin: 0 auto;
            display: flex; flex-direction: column; align-items: center;
            padding: 15px; box-sizing: border-box;
        }
        .header-grid { 
            width: 100%; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        .btn-top {
            background: none; border: 2px solid white; color: white;
            border-radius: 20px; padding: 8px 5px; font-size: 0.75rem; cursor: pointer; text-transform: uppercase;
            width: 100%;
        }
        .btn-fin { border-color: var(--red-win); }
        .btn-participants { border-color: var(--blue-qpuc); }
        .btn-switch { background: #555; border: none; }
        .btn-switch.active { background: var(--red-win); }
        .btn-tirage-nav { background: var(--blue-qpuc); border: none; }
        
        #current-players { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 15px; width: 100%; }
        .player-row { display: flex; gap: 10px; justify-content: center; width: 100%; }
        .player-badge {
            background: white; color: black; border-radius: 30px; padding: 12px;
            font-size: 1.1rem; width: 125px; text-align: center;
            cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.5); text-transform: uppercase;
        }
        
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; z-index: 1000;
        }
        .modal {
            background: white; border-radius: 25px; width: 92%; max-width: 380px;
            margin: 20px auto; color: black; position: relative; padding: 15px;
            max-height: 90vh; display: flex; flex-direction: column;
        }
        .close-circle {
            position: absolute; top: -12px; right: -12px; background: var(--red-exit);
            color: white; width: 35px; height: 35px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            border: 2px solid white; font-size: 20px; font-weight: bold;
        }
        .btn-tirage {
            background: var(--green-tirage); color: white; border-radius: 15px;
            padding: 10px 40px; font-size: 1.6rem; border: none; cursor: pointer;
            align-self: center; margin-bottom: 10px; font-weight: bold;
        }
        .groupes-table { width: 100%; border-collapse: collapse; }
        .groupes-table th { font-size: 0.6rem; color: #777; text-align: center; text-transform: uppercase; }
        .groupes-table td { padding: 8px 2px; text-align: center; font-size: 1rem; }
        .name-td { text-align: left !important; width: 40%; font-size: 0.9rem !important; }
        .status-red { display: none; } 
        .status-blue { color: var(--blue-qpuc); font-weight: bold; }
        input[type="checkbox"] { transform: scale(1.6); }
        .pill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow-y: auto; }
        .p-pill { border: 1.5px solid #ddd; border-radius: 20px; padding: 8px; text-align: center; font-size: 0.85rem; cursor: pointer; color: #999; }
        .p-pill.active { border-color: var(--blue-qpuc); color: black; background: #f8f9fa; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-grid">
        <button class="btn-top btn-fin" onclick="cloturerSession()">Fin</button>
        <button class="btn-top btn-participants" onclick="openM('modal-p')">Participants</button>
        <button id="m-toggle" class="btn-top btn-switch" onclick="toggleModeM()">Switch</button>
        <button class="btn-top btn-tirage-nav" onclick="openM('modal-g')">Tirage</button>
    </div>
    <div id="current-players"></div>
</div>

<div id="modal-g" class="overlay">
    <div class="modal">
        <div class="close-circle" onclick="closeM('modal-g')">✕</div>
        <button class="btn-tirage" onclick="lancerTirage()">TIRAGE</button>
        <div style="overflow-y: auto;">
            <table class="groupes-table">
                <thead>
                    <tr><th style="width:10%"></th><th class="name-td">NOM</th><th>V</th><th>F</th><th>4</th><th>PJ</th></tr>
                </thead>
                <tbody id="body-g"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modal-p" class="overlay">
    <div class="modal">
        <div class="close-circle" onclick="closeM('modal-p')">✕</div>
        <div class="pill-grid" id="grid-p"></div>
    </div>
</div>

<div id="modal-replacement" class="overlay">
    <div class="modal">
        <div class="close-circle" onclick="closeM('modal-replacement')">✕</div>
        <div class="pill-grid" id="grid-replacement"></div>
    </div>
</div>

<script>
    const WEB_APP_URL = `https://script.google.com/macros/s/AKfycbw7rQ1oTrRFAVH5XAbfLT-2KiCp-rAoPRV4JG2am-59AyRrag2OvcGXNQNbSXEFDgJN/exec`;
    let players = ["ANTOINE", "CYRILLE", "DAMIEN", "DANIÈLE", "ELIOTT", "ERIC", "GEOFFREY", "HENRICK", "LOUIS", "LYSIANE", "MADELEINE", "MICHÈLE", "PATRICE", "PATRICIA C", "PATRICIA L", "PHILIPPE L", "PHILIPPE M", "PHILIPPE O", "RENÉ", "ARNAUD", "SÉBASTIEN", "VALERIE", "YANN", "WILLIAM"]
        .map(n => ({ name: n, active: true, victories: 0, faf: 0, als4: 0, pj: 0 }));
    let poolEnJeu = [];
    let playerStates = {};
    let modeM = false;
    let replacementTarget = null;

    const shuffle = (array) => {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    };

    const sortPlayers = (list) => {
        return list.sort((a, b) => {
            if (b.victories !== a.victories) return b.victories - a.victories;
            if (b.faf !== a.faf) return b.faf - a.faf;
            if (b.als4 !== a.als4) return b.als4 - a.als4;
            return b.pj - a.pj;
        });
    };

    const renderDisplay = () => {
        const div = document.getElementById('current-players'); div.innerHTML = '';
        if(poolEnJeu.length === 0) return;
        [poolEnJeu.slice(0, 3), poolEnJeu.slice(3, 5)].forEach(row => {
            const rDiv = document.createElement('div'); rDiv.className = 'player-row';
            row.forEach(n => {
                const b = document.createElement('div'); b.className = 'player-badge';
                const s = playerStates[n] || 1;
                if(s === 2) { b.style.background = 'var(--yellow-4als)'; b.style.color = 'black'; }
                else if(s === 3) { b.style.background = 'var(--orange-faf)'; b.style.color = 'white'; }
                else if(s === 4) { b.style.background = 'var(--red-win)'; b.style.color = 'white'; }
                b.innerText = n;
                b.onclick = () => {
                    if(modeM) { replacementTarget = n; openReplacementModal(); }
                    else { playerStates[n] = (playerStates[n] >= 4) ? 1 : (playerStates[n] || 1) + 1; renderDisplay(); }
                };
                rDiv.appendChild(b);
            });
            div.appendChild(rDiv);
        });
    };

    const sendResultsToSheet = async () => {
        const data = poolEnJeu.map(n => ({ name: n, status: playerStates[n] || 1 }));
        try { await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) }); } catch(e) {}
    };

    const cloturerSession = async () => {
        if(confirm("Fin de séance ? Les scores actuels seront envoyés.")) {
            if (poolEnJeu.length > 0) await sendResultsToSheet();
            location.reload();
        }
    };

    async function lancerTirage() {
        if (poolEnJeu.length > 0) {
            await sendResultsToSheet();
            poolEnJeu.forEach(n => {
                let p = players.find(x => x.name === n);
                let s = playerStates[n] || 1;
                if(s === 4) p.victories += 1; 
                else if(s === 3) p.faf += 1; 
                else if(s === 2) p.als4 += 1;
            });
        }
        
        let currentRanking = sortPlayers([...players].filter(p => p.active));
        let checkedNames = Array.from(document.querySelectorAll('.g-chk:checked')).map(cb => cb.value);
        let selection = [...checkedNames];
        
        if (selection.length < 5) {
            // Création des blocs d'égalités
            let blocks = [];
            currentRanking.forEach(p => {
                let last = blocks[blocks.length - 1];
                if (last && last[0].victories === p.victories && last[0].faf === p.faf && last[0].als4 === p.als4) {
                    last.push(p);
                } else {
                    blocks.push([p]);
                }
            });

            // Direction par défaut : Remonter (partir du bas)
            let goUp = true; 
            let startBlockIdx = blocks.length - 1;

            if (checkedNames.length > 0) {
                let firstChecked = currentRanking.find(p => p.name === checkedNames[0]);
                startBlockIdx = blocks.findIndex(b => b[0].victories === firstChecked.victories && b[0].faf === firstChecked.faf && b[0].als4 === firstChecked.als4);
                // Si coché en haut, on descend
                if (startBlockIdx < blocks.length / 2) goUp = false;
            }

            let currentIdx = startBlockIdx;
            let minPJGlobal = Math.min(...currentRanking.filter(p => !poolEnJeu.includes(p.name)).map(p => p.pj));

            while (selection.length < 5) {
                let block = blocks[currentIdx];
                if (block) {
                    let candidates = block.filter(p => !selection.includes(p.name) && !poolEnJeu.includes(p.name));
                    if (candidates.length > 0) {
                        let priority = shuffle(candidates.filter(p => p.pj === minPJGlobal));
                        let others = shuffle(candidates.filter(p => p.pj !== minPJGlobal));
                        let pool = [...priority, ...others];
                        while (selection.length < 5 && pool.length > 0) {
                            selection.push(pool.shift().name);
                        }
                    }
                }
                currentIdx += goUp ? -1 : 1;
                // Si on sort des limites, on change de direction pour finir de remplir
                if (currentIdx < 0) { goUp = false; currentIdx = 0; }
                if (currentIdx >= blocks.length) { goUp = true; currentIdx = blocks.length - 1; }
                
                let totalEligible = currentRanking.filter(p => !poolEnJeu.includes(p.name)).length;
                if (selection.length >= totalEligible || selection.length >= 5) break;
            }
        }
        
        poolEnJeu = shuffle(selection.slice(0, 5));
        playerStates = {};
        poolEnJeu.forEach(n => { players.find(p => p.name === n).pj++; playerStates[n] = 1; });
        closeM('modal-g');
        renderDisplay();
    }

    const renderG = () => {
        const body = document.getElementById('body-g'); body.innerHTML = '';
        let sorted = sortPlayers([...players].filter(p => p.active));
        let minPJ = Math.min(...sorted.filter(p => !poolEnJeu.includes(p.name)).map(p => p.pj));
        sorted.forEach(p => {
            let isPrevious = poolEnJeu.includes(p.name);
            let tr = document.createElement('tr');
            if (isPrevious) tr.className = 'status-red';
            else if (p.pj === minPJ) tr.className = 'status-blue';
            let shouldBeChecked = (p.pj === 0 && !isPrevious);
            tr.innerHTML = `
                <td><input type="checkbox" class="g-chk" value="${p.name}" ${shouldBeChecked ? 'checked' : ''} ${isPrevious ? 'disabled' : ''}></td>
                <td class="name-td">${p.name}</td>
                <td>${p.victories}</td>
                <td>${p.faf}</td>
                <td>${p.als4}</td>
                <td>${p.pj}</td>
            `;
            body.appendChild(tr);
        });
    };

    const renderP = () => {
        const grid = document.getElementById('grid-p'); grid.innerHTML = '';
        [...players].sort((a,b) => a.name.localeCompare(b.name)).forEach(p => {
            const d = document.createElement('div'); d.className = `p-pill ${p.active?'active':''}`;
            d.innerText = p.name;
            d.onclick = () => { p.active = !p.active; renderP(); };
            grid.appendChild(d);
        });
    };

    function openReplacementModal() {
        const grid = document.getElementById('grid-replacement'); grid.innerHTML = '';
        shuffle(players.filter(p => p.active && !poolEnJeu.includes(p.name))).forEach(p => {
            const d = document.createElement('div'); d.className = 'p-pill active'; d.innerText = p.name;
            d.onclick = () => {
                players.find(x => x.name === replacementTarget).pj--;
                p.pj++;
                poolEnJeu = poolEnJeu.map(n => n === replacementTarget ? p.name : n);
                playerStates[p.name] = 1;
                toggleModeM(); closeM('modal-replacement'); renderDisplay();
            };
            grid.appendChild(d);
        });
        document.getElementById('modal-replacement').style.display = 'block';
    }

    const openM = (id) => { if(id==='modal-g') renderG(); if(id==='modal-p') renderP(); document.getElementById(id).style.display='block'; };
    const closeM = (id) => { document.getElementById(id).style.display='none'; };
    const toggleModeM = () => { modeM = !modeM; document.getElementById('m-toggle').classList.toggle('active', modeM); };
</script>
</body>
</html>
