<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Régie QPUC</title>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --blue-qpuc: #0091d2;
            --green-tirage: #27ae60;
            --red-exit: #d0002d;
            --yellow-4als: #f1c40f;
            --orange-faf: #e67e22;
            --red-win: #c0392b;
        }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--bg-dark); color: white;
            font-family: 'Arial Black', sans-serif; overflow: hidden;
        }
        .main-container {
            width: 100%; max-width: 420px; height: 100vh; margin: 0 auto;
            display: flex; flex-direction: column; align-items: center;
            padding: 15px; box-sizing: border-box;
        }
        .header-btns { width: 100%; display: flex; justify-content: space-between; margin-bottom: 20px; }
        .btn-top {
            background: none; border: 2px solid white; color: white;
            border-radius: 20px; padding: 8px 15px; font-size: 0.8rem; cursor: pointer;
        }
        .btn-top.active { background: var(--red-win); border-color: var(--red-win); }
        
        #current-players { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 15px; width: 100%; }
        .player-row { display: flex; gap: 10px; justify-content: center; width: 100%; }
        .player-badge {
            background: white; color: black; border-radius: 30px; padding: 12px;
            font-size: 1.1rem; width: 120px; text-align: center;
            cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.5); text-transform: uppercase;
        }

        .footer-nav { width: 100%; display: flex; gap: 10px; margin-top: auto; padding-bottom: 10px; }
        .btn-nav {
            flex: 1; background: none; border: 2px solid white; color: white;
            border-radius: 30px; padding: 12px 0; font-size: 0.9rem; cursor: pointer;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; z-index: 1000;
        }
        .modal {
            background: white; border-radius: 25px; width: 92%; max-width: 380px;
            margin: 20px auto; color: black; position: relative; padding: 15px;
            max-height: 90vh; display: flex; flex-direction: column;
        }
        .close-circle {
            position: absolute; top: -12px; right: -12px; background: var(--red-exit);
            color: white; width: 35px; height: 35px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            border: 2px solid white; font-size: 20px; z-index: 1010;
        }

        .btn-tirage {
            background: var(--green-tirage); color: white; border-radius: 15px;
            padding: 10px 40px; font-size: 1.6rem; border: none; cursor: pointer;
            align-self: center; margin-bottom: 10px; font-weight: bold;
        }
        .groupes-table { width: 100%; border-collapse: collapse; }
        .groupes-table th { font-size: 0.7rem; color: #777; text-align: center; }
        .groupes-table td { padding: 8px 4px; text-align: center; font-size: 1.1rem; font-weight: bold; }
        .name-td { text-align: left !important; width: 50%; }
        .status-red { color: var(--red-win); }
        .status-blue { color: var(--blue-qpuc); }
        input[type="checkbox"] { transform: scale(1.6); }

        .pill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow-y: auto; }
        .p-pill { 
            border: 1.5px solid #ddd; border-radius: 20px; padding: 8px;
            text-align: center; font-size: 0.85rem; cursor: pointer; color: #999;
        }
        .p-pill.active { border-color: var(--blue-qpuc); color: black; background: #f8f9fa; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-btns">
        <button class="btn-top" onclick="confirmReset()">Nouvelle séance</button>
        <button id="m-toggle" class="btn-top" onclick="toggleModeM()">Changer joueur</button>
    </div>

    <div id="current-players"></div>

    <div class="footer-nav">
        <button class="btn-nav" onclick="openM('modal-p')">Participants</button>
        <button class="btn-nav" onclick="openM('modal-g')">Groupes</button>
    </div>
</div>

<div id="modal-g" class="overlay">
    <div class="modal">
        <div class="close-circle" onclick="closeM('modal-g')">✕</div>
        <button class="btn-tirage" onclick="lancerTirage()">TIRAGE</button>
        <div style="overflow-y: auto;">
            <table class="groupes-table">
                <thead>
                    <tr><th style="width:15%"></th><th class="name-td"></th><th>SCORE</th><th>PJ</th></tr>
                </thead>
                <tbody id="body-g"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modal-p" class="overlay">
    <div class="modal">
        <div class="close-circle" onclick="closeM('modal-p')">✕</div>
        <div class="pill-grid" id="grid-p"></div>
    </div>
</div>

<div id="modal-replacement" class="overlay">
    <div class="modal">
        <div class="close-circle" onclick="closeM('modal-replacement')">✕</div>
        <div class="pill-grid" id="grid-replacement"></div>
    </div>
</div>

<script>
    const WEB_APP_URL = `https://script.google.com/macros/s/AKfycbw7rQ1oTrRFAVH5XAbfLT-2KiCp-rAoPRV4JG2am-59AyRrag2OvcGXNQNbSXEFDgJN/exec`;

    window.players = ["ANTOINE", "CYRILLE", "DAMIEN", "DANIÈLE", "ELIOTT", "ERIC", "GEOFFREY", "HENRICK", "LOUIS", "LYSIANE", "MADELEINE", "MICHÈLE", "PATRICE", "PATRICIA C", "PATRICIA L", "PHILIPPE L", "PHILIPPE M", "PHILIPPE O", "RENÉ", "ROLANDE", "SÉBASTIEN", "VALERIE", "YANN", "WILLIAM"].map(n => ({ name: n, active: true, score: 0, pj: 0 }));
    window.poolEnJeu = [];
    window.playerStates = {};
    window.modeM = false;
    window.replacementTarget = null;

    window.renderDisplay = function() {
        const div = document.getElementById('current-players'); div.innerHTML = '';
        if(window.poolEnJeu.length === 0) return;
        const rows = [window.poolEnJeu.slice(0, 3), window.poolEnJeu.slice(3, 5)];
        rows.forEach(row => {
            const rDiv = document.createElement('div'); rDiv.className = 'player-row';
            row.forEach(n => {
                const b = document.createElement('div'); b.className = 'player-badge';
                const s = window.playerStates[n] || 1;
                if(s === 2) b.style.background = 'var(--yellow-4als)';
                else if(s === 3) b.style.background = 'var(--orange-faf)';
                else if(s === 4) b.style.background = 'var(--red-win)';
                if(s > 1) b.style.color = (s === 2) ? 'black' : 'white';
                b.innerText = n;
                b.onclick = () => {
                    if(window.modeM) { window.replacementTarget = n; window.openReplacementModal(); }
                    else { window.playerStates[n] = (window.playerStates[n] >= 4) ? 1 : (window.playerStates[n] || 1) + 1; window.renderDisplay(); }
                };
                rDiv.appendChild(b);
            });
            div.appendChild(rDiv);
        });
    };

    window.sendResultsToSheet = async function() {
        const dataToSend = window.poolEnJeu.map(n => ({ name: n, status: window.playerStates[n] || 1 }));
        try { await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(dataToSend) }); } catch(e) {}
    };

    async function lancerTirage() {
        if (window.poolEnJeu.length > 0) {
            await window.sendResultsToSheet();
            window.poolEnJeu.forEach(n => {
                const p = window.players.find(x => x.name === n);
                const s = window.playerStates[n] || 1;
                if(s === 2) p.score += 1; else if(s === 3) p.score += 2; else if(s === 4) p.score += 3;
            });
        }

        const checkedBoxes = Array.from(document.querySelectorAll('.g-chk:checked'));
        let selection = checkedBoxes.map(cb => cb.value);
        
        if (selection.length < 5) {
            // Identifier le groupe de point de départ (le plus bas parmi les cochés)
            let baseScore = 0;
            if (selection.length > 0) {
                baseScore = Math.min(...selection.map(n => window.players.find(p => p.name === n).score));
            }

            // Pool d'éligibles (Actifs et pas dans le match précédent)
            let eligibles = window.players.filter(p => p.active && !window.poolEnJeu.includes(p.name) && !selection.includes(p.name));
            
            // Tri par remontée : Score >= baseScore, puis par score croissant, puis par PJ croissant (retard)
            eligibles.sort((a, b) => {
                if (a.score !== b.score) return a.score - b.score;
                return a.pj - b.pj;
            });

            // On complète avec les éligibles qui ont un score >= baseScore
            let candidates = eligibles.filter(p => p.score >= baseScore);
            while (selection.length < 5 && candidates.length > 0) {
                selection.push(candidates.shift().name);
            }

            // Si toujours pas assez, on prend ce qui reste en dessous
            if (selection.length < 5) {
                let leftovers = eligibles.filter(p => p.score < baseScore).sort((a,b) => b.score - a.score || a.pj - b.pj);
                while (selection.length < 5 && leftovers.length > 0) {
                    selection.push(leftovers.shift().name);
                }
            }
        }

        window.poolEnJeu = selection.slice(0, 5);
        window.playerStates = {};
        window.poolEnJeu.forEach(n => {
            window.players.find(p => p.name === n).pj++;
            window.playerStates[n] = 1;
        });

        closeM('modal-g');
        window.renderDisplay();
    }

    function renderG() {
        const body = document.getElementById('body-g'); body.innerHTML = '';
        const eligibles = window.players.filter(p => p.active && !window.poolEnJeu.includes(p.name));
        const sortedPJs = [...new Set(eligibles.map(p => p.pj))].sort((a,b) => a - b);
        const thresholdBlue = sortedPJs.length > 1 ? sortedPJs[1] : 999;

        let sorted = [...window.players].filter(p => p.active).sort((a,b) => b.score - a.score || a.pj - b.pj);
        
        sorted.forEach(p => {
            let colorClass = 'status-black';
            let isEligible = !window.poolEnJeu.includes(p.name);
            if (!isEligible) colorClass = 'status-red';
            else if (p.pj < thresholdBlue) colorClass = 'status-blue';

            const tr = document.createElement('tr');
            tr.className = colorClass;
            tr.innerHTML = `
                <td><input type="checkbox" class="g-chk" value="${p.name}" ${p.pj === 0 && isEligible ? 'checked' : ''}></td>
                <td class="name-td">${p.name}</td>
                <td>${p.score}</td>
                <td>${p.pj}</td>
            `;
            body.appendChild(tr);
        });
    }

    function openM(id) { 
        if(id === 'modal-g') renderG(); 
        if(id === 'modal-p') renderP();
        document.getElementById(id).style.display = 'block'; 
    }
    function closeM(id) { document.getElementById(id).style.display = 'none'; }
    function toggleModeM() { window.modeM = !window.modeM; document.getElementById('m-toggle').classList.toggle('active', window.modeM); }

    function renderP() {
        const grid = document.getElementById('grid-p'); grid.innerHTML = '';
        window.players.sort((a,b) => a.name.localeCompare(b.name)).forEach(p => {
            const d = document.createElement('div'); d.className = `p-pill ${p.active?'active':''}`;
            d.innerText = p.name;
            d.onclick = () => { p.active = !p.active; renderP(); };
            grid.appendChild(d);
        });
    }

    window.openReplacementModal = function() {
        const grid = document.getElementById('grid-replacement'); grid.innerHTML = '';
        window.players.filter(p => p.active && !window.poolEnJeu.includes(p.name)).sort((a,b) => a.name.localeCompare(b.name)).forEach(p => {
            const d = document.createElement('div'); d.className = 'p-pill active'; d.innerText = p.name;
            d.onclick = () => {
                window.players.find(x => x.name === window.replacementTarget).pj--;
                p.pj++;
                window.poolEnJeu = window.poolEnJeu.map(n => n === window.replacementTarget ? p.name : n);
                window.playerStates[p.name] = 1;
                delete window.playerStates[window.replacementTarget];
                toggleModeM(); closeM('modal-replacement'); window.renderDisplay();
            };
            grid.appendChild(d);
        });
        document.getElementById('modal-replacement').style.display = 'block';
    };

    function confirmReset() { if(confirm("Nouvelle séance ?")) { window.sendResultsToSheet(); location.reload(); } }
</script>
</body>
</html>
