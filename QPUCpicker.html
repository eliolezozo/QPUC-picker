<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QPUC - Régie Stratégique</title>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --blue-main: #3498db;
            --white: #ffffff;
            --yellow-4als: #f1c40f;
            --orange-faf: #e67e22;
            --red-win: #c0392b;
            --text-red: #c0392b;
            --text-blue: #3498db;
        }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--bg-dark); color: var(--white);
            font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden;
        }
        .main-container {
            width: 100%; max-width: 400px; height: 100vh; margin: 0 auto;
            display: flex; flex-direction: column; align-items: center;
            padding: 15px; box-sizing: border-box; justify-content: space-between;
        }
        .top-bar { width: 100%; display: flex; justify-content: space-between; }
        .btn-top-reset {
            background: none; border: 1.5px solid white; color: white;
            border-radius: 30px; padding: 6px 15px; font-size: 0.75rem; cursor: pointer;
        }
        #current-players { display: flex; flex-direction: column; align-items: center; gap: 15px; flex: 1; justify-content: center; width: 100%; }
        .player-badge {
            background: white; color: black; border-radius: 25px; padding: 12px 25px;
            font-size: 1.2rem; min-width: 150px; text-align: center; cursor: pointer;
            font-weight: 700; text-transform: uppercase; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .nav-buttons { width: 100%; display: flex; gap: 10px; margin-bottom: env(safe-area-inset-bottom); }
        .btn-nav {
            flex: 1; background: none; border: 1.5px solid white; color: white;
            border-radius: 30px; padding: 12px 0; font-size: 0.85rem; cursor: pointer; font-weight: 600;
        }
        .btn-m.active { background: var(--red-win); border-color: var(--red-win); }
        
        /* Modal Groupes Style Image */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; z-index: 1000;
        }
        .modal-groupes {
            background: white; border-radius: 30px; width: 90%; max-width: 380px;
            margin: 5% auto; color: black; padding: 20px; position: relative;
            max-height: 85vh; display: flex; flex-direction: column;
        }
        .tirage-header {
            background: #27ae60; color: white; border: none; border-radius: 15px;
            padding: 10px 40px; font-size: 1.5rem; font-weight: 900; align-self: center;
            cursor: pointer; margin-bottom: 15px; text-transform: uppercase;
        }
        .close-red {
            position: absolute; top: -10px; right: -10px; background: var(--red-win);
            color: white; width: 35px; height: 35px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer;
        }
        .groupes-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .groupes-table th { color: #888; font-size: 0.7rem; text-transform: uppercase; padding: 5px; }
        .groupes-table td { padding: 8px 5px; text-align: center; font-weight: 800; font-size: 1.1rem; }
        .name-cell { text-align: left !important; width: 45%; }
        .check-cell { width: 10%; }
        input[type="checkbox"] { transform: scale(1.5); }
        
        /* Couleurs UI */
        .status-red { color: var(--text-red); }
        .status-blue { color: var(--text-blue); }
        .status-black { color: black; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="top-bar">
        <button class="btn-top-reset" onclick="resetSession()">Nouvelle séance</button>
    </div>

    <div id="current-players">
        <div style="opacity: 0.5">Appuyez sur "Groupes" pour tirer les joueurs</div>
    </div>

    <div style="width:100%; text-align:center; margin-bottom:10px;">
        <button id="btn-m" class="btn-nav" style="max-width:200px" onclick="toggleModeM()">Changer joueur</button>
    </div>

    <div class="nav-buttons">
        <button class="btn-nav" onclick="openModal('modal-p')">Participants</button>
        <button class="btn-nav" onclick="openModal('modal-g')">Groupes</button>
    </div>
</div>

<div id="modal-g" class="overlay">
    <div class="modal-groupes">
        <div class="close-red" onclick="closeModal('modal-g')">✕</div>
        <button class="tirage-header" onclick="executerTirage()">Tirage</button>
        
        <div style="overflow-y: auto; flex: 1;">
            <table class="groupes-table">
                <thead>
                    <tr>
                        <th class="check-cell"></th>
                        <th class="name-cell"></th>
                        <th>Score</th>
                        <th>Parties</th>
                    </tr>
                </thead>
                <tbody id="groupes-body">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<div id="modal-p" class="overlay">
    <div class="modal-groupes" style="max-width: 300px;">
        <div class="close-red" onclick="closeModal('modal-p')">✕</div>
        <div style="font-weight: 800; text-align: center; margin-bottom: 15px;">ACTIVER / DÉSACTIVER</div>
        <div id="participants-list" style="overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
        </div>
    </div>
</div>

<script>
    let players = ["ANTOINE", "CYRILLE", "DAMIEN", "DANIÈLE", "ELIOTT", "ERIC", "GEOFFREY", "HENRICK", "LOUIS", "LYSIANE", "MADELEINE", "MICHÈLE", "PATRICE", "PATRICIA C", "PATRICIA L", "PHILIPPE L", "PHILIPPE M", "PHILIPPE O", "RENÉ", "ROLANDE", "SÉBASTIEN", "VALERIE", "YANN", "WILLIAM"].map(n => ({ name: n, active: true, score: 0, pj: 0 }));
    
    let poolEnJeu = [];
    let playerStates = {};
    let modeM = false;
    let lastPool = [];

    function openModal(id) {
        if(id === 'modal-g') renderGroupes();
        if(id === 'modal-p') renderParticipants();
        document.getElementById(id).style.display = 'block';
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function renderParticipants() {
        const list = document.getElementById('participants-list');
        list.innerHTML = '';
        players.sort((a,b) => a.name.localeCompare(b.name)).forEach(p => {
            const div = document.createElement('div');
            div.style.display = 'flex';
            div.style.justifyContent = 'space-between';
            div.innerHTML = `<span>${p.name}</span><input type="checkbox" ${p.active?'checked':''} onchange="toggleActive('${p.name}')">`;
            list.appendChild(div);
        });
    }

    function toggleActive(name) {
        let p = players.find(x => x.name === name);
        p.active = !p.active;
    }

    function renderGroupes() {
        const body = document.getElementById('groupes-body');
        body.innerHTML = '';
        
        // Calcul du retard (moyenne PJ des éligibles)
        const eligibles = players.filter(p => p.active && !poolEnJeu.includes(p.name));
        const avgPJ = eligibles.length ? eligibles.reduce((acc, p) => acc + p.pj, 0) / eligibles.length : 0;

        // Tri : Score DESC, puis PJ ASC
        let sorted = players.filter(p => p.active).sort((a,b) => {
            if(b.score !== a.score) return b.score - a.score;
            return a.pj - b.pj;
        });

        sorted.forEach(p => {
            let colorClass = 'status-black';
            if(poolEnJeu.includes(p.name)) colorClass = 'status-red';
            else if(p.pj < Math.floor(avgPJ)) colorClass = 'status-blue';

            const tr = document.createElement('tr');
            tr.className = colorClass;
            tr.innerHTML = `
                <td class="check-cell"><input type="checkbox" class="tirage-check" value="${p.name}"></td>
                <td class="name-cell">${p.name}</td>
                <td>${p.score}</td>
                <td>${p.pj}</td>
            `;
            body.appendChild(tr);
        });
    }

    function executerTirage() {
        // Enregistrer les scores de la partie précédente avant de changer
        if(poolEnJeu.length > 0) {
            poolEnJeu.forEach(name => {
                let p = players.find(x => x.name === name);
                let s = playerStates[name] || 1;
                if(s === 2) p.score += 1;
                if(s === 3) p.score += 2;
                if(s === 4) p.score += 3;
            });
        }

        const checks = document.querySelectorAll('.tirage-check:checked');
        let selectionnes = Array.from(checks).map(c => c.value);
        
        if(selectionnes.length === 0) return alert("Cochez au moins un joueur");

        // On complète si < 5
        if(selectionnes.length < 5) {
            let actifsEligibles = players.filter(p => p.active && !poolEnJeu.includes(p.name) && !selectionnes.includes(p.name));
            
            // Tri par proximité de score avec la moyenne de la sélection
            let avgScoreSel = selectionnes.reduce((acc, n) => acc + players.find(x=>x.name===n).score, 0) / selectionnes.length;
            
            actifsEligibles.sort((a,b) => {
                let distA = Math.abs(a.score - avgScoreSel);
                let distB = Math.abs(b.score - avgScoreSel);
                if(distA !== distB) return distA - distB;
                return a.pj - b.pj; // Priorité retard
            });

            while(selectionnes.length < 5 && actifsEligibles.length > 0) {
                selectionnes.push(actifsEligibles.shift().name);
            }
        }

        // Finalisation
        poolEnJeu = selectionnes.slice(0, 5);
        playerStates = {};
        poolEnJeu.forEach(name => {
            players.find(x => x.name === name).pj += 1;
            playerStates[name] = 1;
        });

        closeModal('modal-g');
        renderMain();
    }

    function renderMain() {
        const container = document.getElementById('current-players');
        container.innerHTML = '';
        poolEnJeu.forEach(name => {
            const b = document.createElement('div');
            b.className = 'player-badge';
            updateBadgeStyle(b, name);
            b.innerText = name;
            b.onclick = () => {
                if(modeM) swapPlayer(name);
                else {
                    playerStates[name] = (playerStates[name] % 4) + 1;
                    updateBadgeStyle(b, name);
                }
            };
            container.appendChild(b);
        });
    }

    function updateBadgeStyle(el, name) {
        let s = playerStates[name];
        el.style.background = 'white'; el.style.color = 'black';
        if(s === 2) { el.style.background = 'var(--yellow-4als)'; }
        if(s === 3) { el.style.background = 'var(--orange-faf)'; el.style.color = 'white'; }
        if(s === 4) { el.style.background = 'var(--red-win)'; el.style.color = 'white'; }
    }

    function toggleModeM() {
        modeM = !modeM;
        document.getElementById('btn-m').classList.toggle('active', modeM);
    }

    function swapPlayer(oldName) {
        const newName = prompt("Remplacer " + oldName + " par (NOM) :");
        if(newName && players.find(x => x.name === newName.toUpperCase())) {
            let pOld = players.find(x => x.name === oldName);
            let pNew = players.find(x => x.name === newName.toUpperCase());
            pOld.pj--; 
            pNew.pj++;
            poolEnJeu = poolEnJeu.map(n => n === oldName ? pNew.name : n);
            playerStates[pNew.name] = 1;
            delete playerStates[oldName];
            renderMain();
        }
        toggleModeM();
    }

    function resetSession() {
        if(confirm("Réinitialiser les scores et PJ ?")) {
            players.forEach(p => { p.score = 0; p.pj = 0; });
            poolEnJeu = [];
            renderMain();
        }
    }
</script>
</body>
</html>
